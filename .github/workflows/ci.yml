name: ci

# Tests and lint. Separate from releases (release.yml) and never builds the
# packaged program.
#
# Runs on every pull request and on pushes to main: the repository is public,
# so standard runners are free, and this is the gate for work done by agents.
# Pull requests from forks get a read-only token and no secrets.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"
  FORCE_COLOR: "1"

# No artifact uploads and no caches of any kind (pip, npm, Playwright): the
# owner's Actions storage quota is exhausted.

jobs:
  # Three jobs side by side; the job named "Lint and tests (Linux)" at the end
  # is the one branch protection requires, and it passes only if all three do.
  # The Windows job runs beside them and is not part of that check (yet).
  backend:
    name: Backend and bench
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backend and bench dependencies
        run: |
          python -m pip install -r backend/requirements-dev.txt
          python -m pip install -r bench/requirements.txt

      - name: Backend lint (ruff)
        working-directory: backend
        run: ruff check .

      - name: Backend tests (pytest, one worker per core)
        working-directory: backend
        run: python -m pytest -q -n auto

      - name: Bench tests (pytest)
        working-directory: bench  # tests import closet_bench from this folder
        run: python -m pytest -q tests

  web:
    name: Web page (lint, types, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false  # newer setup-node caches automatically otherwise

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Frontend build (into backend/closet/web)
        working-directory: frontend
        run: npm run build

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend build (into backend/closet/web)
        working-directory: frontend
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Browser tests (Playwright, against the real backend)
        working-directory: frontend
        env:
          CLOSET_PYTHON: python  # the setup-python interpreter with backend deps installed
        run: npm run e2e

  # The backend tests on Windows, where the owner's hub runs: the Windows-only code (Credential Manager, the
  # start-at-login registry entry, the tray, starting `claude.exe`) is only exercised here. Not one of the
  # required jobs yet, and no browser tests. PYTHONUTF8 is off, as in the packaged program, so text that is
  # read or written without saying UTF-8 fails here the way it would on the owner's PC.
  windows:
    name: Backend tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Backend tests (pytest, one worker per core)
        working-directory: backend
        run: python -m pytest -q -n auto

  test:
    name: Lint and tests (Linux)
    if: always()
    needs: [backend, web, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All three jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "backend, web, browser: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || { echo "::error::a job did not pass ($r)"; exit 1; }; done
