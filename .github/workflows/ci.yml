name: ci

# Tests and lint. Separate from releases (release.yml) and never builds the
# packaged program.
#
# Runs on every pull request and on pushes to main: the repository is public,
# so standard runners are free, and this is the gate for work done by agents.
# Pull requests from forks get a read-only token and no secrets.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"
  FORCE_COLOR: "1"

# No artifact uploads and no caches of any kind (pip, npm, Playwright): the
# owner's Actions storage quota is exhausted.

jobs:
  # Four jobs side by side; the job named "Lint and tests (Linux)" at the end
  # is the one branch protection requires, and it passes only if all four do.
  # The Windows job runs beside them and is not part of that check (yet).
  # The backend tests marked `slow` are left out of the backend and Windows
  # jobs; the `slow` job runs them when their code changes, and nightly.yml
  # runs everything every night.
  backend:
    name: Backend and bench
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backend and bench dependencies
        run: python -m pip install -r backend/requirements-dev.txt   # the bench needs nothing more

      - name: Backend lint (ruff)
        working-directory: backend
        run: ruff check .

      - name: Backend tests (pytest, one worker per core)
        working-directory: backend
        run: python -m pytest -q -n auto -m "not slow"

      - name: Bench tests (pytest, one worker per core)
        working-directory: bench  # tests import closet_bench from this folder
        run: python -m pytest -q -n auto tests

  web:
    name: Web page (lint, types, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false  # newer setup-node caches automatically otherwise

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Frontend build (into backend/closet/web)
        working-directory: frontend
        run: npm run build

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend build (into backend/closet/web)
        working-directory: frontend
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Browser tests (Playwright, against the real backend)
        working-directory: frontend
        env:
          CLOSET_PYTHON: python  # the setup-python interpreter with backend deps installed
        run: npm run e2e

  # The backend tests on Windows, where the owner's hub runs: the Windows-only code (Credential Manager, the
  # start-at-login registry entry, the tray, starting `claude.exe`) is only exercised here. Not one of the
  # required jobs yet, and no browser tests. PYTHONUTF8 is off, as in the packaged program, so text that is
  # read or written without saying UTF-8 fails here the way it would on the owner's PC.
  windows:
    name: Backend tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Backend tests (pytest, one worker per core)
        working-directory: backend
        run: python -m pytest -q -n auto -m "not slow"

  # The backend tests marked `slow` (pure image tests: pattern measuring, shoe tracing, shoes drawn by Claude), which
  # the two jobs above leave out. They run here only when the change touches the code they cover, and every night on
  # main (nightly.yml). The job itself always runs and passes when there is nothing to test, so the required check
  # below can count on it; the tests are only installed and run when the change touched that code.
  slow:
    name: Slow image tests (when their code changes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # A pull request is checked out as the merge of its branch into the base: its first parent is the base,
          # so two commits are enough to see what the pull request changes. On a push to main, the commit before.
          fetch-depth: 2

      - name: Did this change touch the image code?
        id: paths
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # The test files are the ones that carry the marker, so a newly marked file is covered without editing this.
          tests=$( (grep -l "pytest.mark.slow" backend/tests/*.py || true) | sed 's/[.]/[.]/g; s/$/$/' | paste -sd '|' -)
          code='backend/closet/patterns/|backend/closet/drawing/(trace|traced|drawn|drawnside|turned)[.]py$|backend/closet/tagger/shoedrawing[.]py$|backend/tests/shoe_photos[.]py$'
          other='backend/requirements[^/]*[.]txt$|backend/pyproject[.]toml$|[.]github/workflows/ci[.]yml$'
          pattern="^(${code}|${other}${tests:+|}${tests})"
          if [ "$EVENT" = workflow_dispatch ]; then
            run=true
          elif changed=$(git diff --name-only HEAD^1 HEAD); then
            echo "$changed"
            if grep -Eq "$pattern" <<<"$changed"; then run=true; else run=false; fi
          else
            run=true   # no earlier commit to compare with: run them
          fi
          echo "run the slow tests: $run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        if: steps.paths.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        if: steps.paths.outputs.run == 'true'
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Slow backend tests (pytest, one worker per core)
        if: steps.paths.outputs.run == 'true'
        working-directory: backend
        run: python -m pytest -q -n auto -m slow

  test:
    name: Lint and tests (Linux)
    if: always()
    needs: [backend, web, browser, slow]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All the jobs passed
        env:
          RESULTS: ${{ needs.backend.result }} ${{ needs.web.result }} ${{ needs.browser.result }}
          SLOW: ${{ needs.slow.result }}
        run: |
          echo "backend, web, browser: $RESULTS; slow image tests: $SLOW"
          for r in $RESULTS; do [ "$r" = success ] || { echo "::error::a job did not pass ($r)"; exit 1; }; done
          # the slow job passes when it has nothing to test; were it ever skipped as a whole, that is not a failure
          case "$SLOW" in success|skipped) ;; *) echo "::error::the slow image tests did not pass ($SLOW)"; exit 1;; esac
