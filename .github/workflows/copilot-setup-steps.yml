name: copilot setup steps

# Prepares the environment a Copilot cloud agent starts in, so it can run the
# tests straight away. GitHub only uses this file once it is on the default
# branch, and only the job named `copilot-setup-steps`.
#
# It also runs when this file changes, to check that the steps still work.
#
# timeout-minutes is also the cloud agent's session limit (59 is the most
# GitHub allows). At 30, agents ran out of time before pushing their work.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 59
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install backend and bench dependencies
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt
          python -m pip install --disable-pip-version-check -r bench/requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install the browser the browser tests use
        working-directory: frontend
        run: npx playwright install --with-deps chromium
