name: packaging-spike (throwaway proof)

# The packaging SPIKE, kept for its ffmpeg proof (needed in a later phase).
# It does not build Closet: the real build is packaging/closet.spec, released
# by release.yml. See packaging/README.md.

# Manual runs only. Deliberately no push / pull_request triggers: the Actions
# quota is tight. Windows always builds; macOS (Apple Silicon) only on request.
on:
  workflow_dispatch:
    inputs:
      build_macos:
        description: "Also build and smoke-test on Apple Silicon macOS"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: packaging-spike-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

# No artifact uploads and no actions/cache steps (storage quota is exhausted).
# No pip cache either: it would use the same storage quota.

jobs:
  windows:
    name: Windows one-file exe
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: packaging/spike
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install requirements
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Build one-file executable with PyInstaller
        run: python -m PyInstaller --noconfirm --clean closet_spike.spec

      - name: Print executable size
        run: |
          python - dist/closet-spike.exe <<'PY'
          import os, platform, sys
          path = sys.argv[1]
          size = os.path.getsize(path)
          line = f"{path}: {size:,} bytes ({size / 1048576:.1f} MiB) built on {platform.platform()} {platform.machine()}"
          print(line)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write(line + "\n")
          PY

      - name: List bundled native files (diagnostic)
        run: pyi-archive_viewer -l dist/closet-spike.exe | grep -i -E "\.dll|\.pyd|ffmpeg" || true

      - name: Smoke test the executable
        run: python smoke_test.py dist/closet-spike.exe

  macos:
    name: macOS (Apple Silicon) one-file executable
    if: ${{ inputs.build_macos }}
    runs-on: macos-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: packaging/spike
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Require an Apple Silicon runner
        run: |
          uname -m
          test "$(uname -m)" = "arm64"

      - name: Install requirements
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Build one-file executable with PyInstaller
        run: python -m PyInstaller --noconfirm --clean closet_spike.spec

      - name: Print executable size
        run: |
          python - dist/closet-spike <<'PY'
          import os, platform, sys
          path = sys.argv[1]
          size = os.path.getsize(path)
          line = f"{path}: {size:,} bytes ({size / 1048576:.1f} MiB) built on {platform.platform()} {platform.machine()}"
          print(line)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write(line + "\n")
          PY

      - name: List bundled native files (diagnostic)
        run: pyi-archive_viewer -l dist/closet-spike | grep -i -E "\.dylib|\.so|ffmpeg" || true

      - name: Smoke test the executable
        run: python smoke_test.py dist/closet-spike
