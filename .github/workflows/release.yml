name: release

# Builds, smoke-tests and publishes a release of Closet. Started by hand only:
# Actions tab -> release -> Run workflow, on the commit to be released.
#
#   prepare  validate the version, create a DRAFT release v<version>
#   windows  (unless build_windows is unticked) build Closet.exe, smoke-test
#            it, upload it to the draft
#   macos    (only when build_macos is ticked) build Closet.app, zip it,
#            smoke-test the unzipped copy, upload the zip to the draft
#   publish  all builds passed -> publish the draft, which creates the tag
#            v<version> on the dispatched commit; otherwise delete the
#            draft (and any tag) and fail
#
# Nobody creates tags by hand. Files are never passed between jobs: artifact
# and cache storage are unavailable (quota exhausted), so each build job
# uploads its own file straight to the draft release once its tests pass.
#
# Inputs are never interpolated into shell scripts; they reach scripts only
# through `env:`.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 0.1.0)"
        required: true
        type: string
      build_windows:
        description: "Build the Windows program"
        type: boolean
        default: true
      build_macos:
        description: "Also build the macOS (Apple Silicon) app"
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      build_windows:
        type: boolean
        default: true
      build_macos:
        type: boolean
        default: false

permissions: {}  # each job asks for what it needs

# One release at a time. A second run waits for the first (it is not
# cancelled); GitHub keeps at most one waiting run per group.
concurrency:
  group: release
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  prepare:
    name: Validate and create draft release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # create the draft release
    outputs:
      version: ${{ steps.validate.outputs.version }}
      tag: ${{ steps.validate.outputs.tag }}
    steps:
      - name: Validate the version
        id: validate
        env:
          VERSION: ${{ inputs.version }}
          BUILD_WINDOWS: ${{ inputs.build_windows }}
          BUILD_MACOS: ${{ inputs.build_macos }}
        run: |
          if [ "$BUILD_WINDOWS" != true ] && [ "$BUILD_MACOS" != true ]; then
            echo "::error::nothing to build: neither Windows nor macOS was asked for"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::version '$VERSION' is not like 1.2.3 or 1.2.3-beta.1 (no leading v)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Require that release and tag v<version> do not exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.validate.outputs.tag }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --silent 2>/dev/null; then
            echo "::error::tag $TAG already exists"
            exit 1
          fi
          # Draft releases have no tag yet, so check the release list as well.
          # (Captured first: under pipefail, `gh | grep -q` can fail with SIGPIPE.)
          tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')
          if grep -qxF "$TAG" <<<"$tags"; then
            echo "::error::a release (maybe a leftover draft) named $TAG already exists; delete it first"
            exit 1
          fi

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.validate.outputs.tag }}
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          gh release create "$TAG" --draft --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Closet $VERSION" \
            --notes "Build in progress (run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          echo "Draft release $TAG created for $GITHUB_SHA"

  windows:
    name: Windows (Closet.exe)
    needs: prepare
    if: ${{ inputs.build_windows }}
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write  # upload to the draft release (the token is only given to that step)
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build the frontend (into backend/closet/web)
        working-directory: frontend
        run: npm ci && npm run build

      - name: Install Python requirements
        run: python -m pip install -r backend/requirements.txt -r packaging/requirements-build.txt

      - name: Write the build version
        run: printf 'VERSION = "%s"\n' "$VERSION" > backend/closet/_build_version.py

      - name: Build Closet.exe with PyInstaller
        run: python -m PyInstaller --noconfirm --clean packaging/closet.spec --distpath dist --workpath build/pyinstaller

      - name: Print the file size
        run: |
          python -c "import os, sys; n = os.path.getsize(sys.argv[1]); print(f'{sys.argv[1]}: {n:,} bytes ({n / 1048576:.1f} MiB)')" dist/Closet.exe

      - name: Smoke test
        run: python packaging/smoke_test.py dist/Closet.exe --expect-version "$VERSION"

      # The brief asked for the cutout check as a separate job with the model
      # cached. With no cache or artifact storage, a separate job would have
      # to rebuild the program, so it runs here as its own group of steps.
      - name: "Cutout check: download the model (URL from backend/closet/cutout.py)"
        run: |
          url=$(python -c 'import sys; sys.path.insert(0, "backend"); from closet.cutout import MODELS; print(MODELS["isnet-general-use"].url)' | tr -d '\r')
          echo "$url"
          mkdir -p build/model
          curl -fsSL --retry 3 --retry-delay 5 -o build/model/isnet-general-use.onnx "$url"

      - name: "Cutout check: verify the model against the sha256 pinned in cutout.py"
        run: |
          python - build/model/isnet-general-use.onnx <<'PY'
          import sys
          sys.path.insert(0, "backend")
          from closet.cutout import MODELS, sha256_of
          want, got = MODELS["isnet-general-use"].sha256, sha256_of(sys.argv[1])
          print(f"expected {want}\nactual   {got}")
          sys.exit(0 if got == want else "model checksum mismatch")
          PY

      - name: "Cutout check: run selfcheck --cutout"
        run: python packaging/smoke_test.py dist/Closet.exe --cutout --model build/model/isnet-general-use.onnx --expect-version "$VERSION"

      - name: Upload Closet.exe to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/Closet.exe --clobber --repo "$GITHUB_REPOSITORY"

  macos:
    name: macOS Apple Silicon (Closet.app)
    needs: prepare
    if: ${{ inputs.build_macos }}
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write  # upload to the draft release (the token is only given to that step)
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Require an Apple Silicon runner
        run: |
          uname -m
          test "$(uname -m)" = "arm64"

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Require an arm64 Python
        run: python -c "import platform, sys; m = platform.machine(); print(m); sys.exit(m != 'arm64')"

      - name: Build the frontend (into backend/closet/web)
        working-directory: frontend
        run: npm ci && npm run build

      - name: Install Python requirements
        run: python -m pip install -r backend/requirements.txt -r packaging/requirements-build.txt

      - name: Write the build version
        run: printf 'VERSION = "%s"\n' "$VERSION" > backend/closet/_build_version.py

      - name: Build Closet.app with PyInstaller
        run: python -m PyInstaller --noconfirm --clean packaging/closet.spec --distpath dist --workpath build/pyinstaller

      - name: Zip the app (ditto keeps the bundle intact)
        run: ditto -c -k --keepParent dist/Closet.app dist/Closet-mac-arm64.zip

      - name: Unzip a copy to test what users download
        run: |
          rm -rf build/unzipped
          ditto -x -k dist/Closet-mac-arm64.zip build/unzipped
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" -c "Print :LSUIElement" build/unzipped/Closet.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 build/unzipped/Closet.app
          codesign -dv build/unzipped/Closet.app 2>&1 | grep -E "Signature|Identifier" || true

      - name: Print the file size
        run: |
          python -c "import os, sys; n = os.path.getsize(sys.argv[1]); print(f'{sys.argv[1]}: {n:,} bytes ({n / 1048576:.1f} MiB)')" dist/Closet-mac-arm64.zip
          du -sh dist/Closet.app

      - name: Smoke test
        run: python packaging/smoke_test.py build/unzipped/Closet.app/Contents/MacOS/Closet --expect-version "$VERSION"

      # Separate group of steps rather than a job: see the Windows job.
      - name: "Cutout check: download the model (URL from backend/closet/cutout.py)"
        run: |
          url=$(python -c 'import sys; sys.path.insert(0, "backend"); from closet.cutout import MODELS; print(MODELS["isnet-general-use"].url)' | tr -d '\r')
          echo "$url"
          mkdir -p build/model
          curl -fsSL --retry 3 --retry-delay 5 -o build/model/isnet-general-use.onnx "$url"

      - name: "Cutout check: verify the model against the sha256 pinned in cutout.py"
        run: |
          python - build/model/isnet-general-use.onnx <<'PY'
          import sys
          sys.path.insert(0, "backend")
          from closet.cutout import MODELS, sha256_of
          want, got = MODELS["isnet-general-use"].sha256, sha256_of(sys.argv[1])
          print(f"expected {want}\nactual   {got}")
          sys.exit(0 if got == want else "model checksum mismatch")
          PY

      - name: "Cutout check: run selfcheck --cutout"
        run: python packaging/smoke_test.py build/unzipped/Closet.app/Contents/MacOS/Closet --cutout --model build/model/isnet-general-use.onnx --expect-version "$VERSION"

      - name: Upload Closet-mac-arm64.zip to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/Closet-mac-arm64.zip --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    name: Publish (or delete the draft)
    needs: [prepare, windows, macos]
    # Run even when a build failed or was cancelled, but never when prepare
    # failed: then the release named v<version> (if any) is not ours.
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # publish or delete the release and its tag
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      WINDOWS_RESULT: ${{ needs.windows.result }}
      MACOS_RESULT: ${{ needs.macos.result }}
      BUILD_WINDOWS: ${{ inputs.build_windows }}
      BUILD_MACOS: ${{ inputs.build_macos }}
    steps:
      - name: Check the build results
        run: |
          echo "windows: $WINDOWS_RESULT (build_windows=$BUILD_WINDOWS)   macos: $MACOS_RESULT (build_macos=$BUILD_MACOS)"
          if [ "$BUILD_WINDOWS" = true ]; then
            test "$WINDOWS_RESULT" = success
          else
            test "$WINDOWS_RESULT" = skipped
          fi
          if [ "$BUILD_MACOS" = true ]; then
            test "$MACOS_RESULT" = success
          else
            test "$MACOS_RESULT" = skipped
          fi

      - name: Publish the release (creates the tag)
        run: |
          {
            echo "Closet $VERSION, built from $GITHUB_SHA."
            echo
            if [ "$BUILD_WINDOWS" = true ]; then
              cat <<'NOTES'
          ## First run on Windows

          1. Download **Closet.exe** below and keep it somewhere permanent (for example your Documents folder).
          2. Double-click it. The program is not signed, so Windows may say "Windows protected your PC": click **More info**, then **Run anyway**.
          3. The first start takes a little longer while the program unpacks. Closet then opens in your browser, and a coat-hanger icon appears near the clock (look under the ^ arrow). Quit from that icon or from Settings.
          4. Your closet is kept in the **Closet** folder in your user folder, never next to the program.

          NOTES
            else
              echo "No Windows build in this release."
              echo
            fi
            if [ "$BUILD_MACOS" = true ]; then
              cat <<'NOTES'
          ## First run on a Mac (Apple Silicon, macOS 14 or later)

          1. Download **Closet-mac-arm64.zip** below and open it; drag **Closet.app** into Applications.
          2. The app is not signed by Apple, so the first time macOS refuses to open it. Double-click it once, close the message, then open **System Settings > Privacy & Security**, scroll down and click **Open Anyway** next to Closet, and confirm.
          3. Closet opens in your browser and shows a coat-hanger icon in the menu bar (there is no Dock icon). Quit from that icon or from Settings.
          4. Your closet is kept in the **Closet** folder in your home folder.

          NOTES
            else
              echo "No macOS build in this release."
              echo
            fi
            cat <<'NOTES'
          ## Good to know

          On first start Closet downloads its background-removal model (about 170 MB) into your closet folder. The demo closet works before that finishes.
          NOTES
          } > notes.md
          cat notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --notes-file notes.md
          for attempt in 1 2 3 4 5 6; do
            sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha 2>/dev/null) && break
            sleep 5
          done
          echo "Published $TAG; the tag points at ${sha:-nothing} (expected $GITHUB_SHA)"
          test "$sha" = "$GITHUB_SHA"

      - name: Delete the draft release and any tag (a build failed)
        if: ${{ failure() }}
        run: |
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || echo "no release $TAG to delete"
          # prepare checked that the tag did not exist before this run.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --silent 2>/dev/null; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG"
            echo "deleted tag $TAG"
          fi
          echo "::error::release $TAG was not published: windows=$WINDOWS_RESULT macos=$MACOS_RESULT"
          exit 1
