[project]
name = "closet"
version = "0.1.0"
description = "A private, single-user wardrobe app"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["windows: runs only on Windows (the CI's Windows job); skipped on other computers"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B904", "UP007"]

[tool.ruff.lint.per-file-ignores]
# The drawing code moved here from the bench, which was not linted. It is kept as it was, so the
# drawings cannot change by accident: lambdas, short names (l = lightness), zip without strict=.
"closet/drawing/{templates,illustrate,fills}.py" = ["B905", "E731", "E741", "F841"]
